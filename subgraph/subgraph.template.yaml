specVersion: 1.3.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CrowdfundingFactory
    network: {{network}}
    source:
      address: "{{factoryAddress}}"
      abi: CrowdfundingFactory
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Campaign
        - User
        - PlatformStats
      abis:
        - name: CrowdfundingFactory
          file: ./abis/CrowdfundingFactory.json
        - name: Campaign
          file: ./abis/Campaign.json
      eventHandlers:
        - event: CampaignCreated(indexed address,indexed address,uint256,uint256,string)
          handler: handleCampaignCreated
      file: ./src/mapping.ts
templates:
  - kind: ethereum
    name: Campaign
    network: {{network}}
    source:
      abi: Campaign
    mapping:
      kind: ethereum/logs
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Campaign
        - Contribution
        - Withdrawal
        - Refund
        - User
        - PlatformStats
      abis:
        - name: Campaign
          file: ./abis/Campaign.json
      eventHandlers:
        - event: ContributionMade(indexed address,uint256)
          handler: handleContributionMade
        - event: GoalReached(uint256)
          handler: handleGoalReached
        - event: WithdrawalMade(indexed address,uint256)
          handler: handleWithdrawalMade
        - event: RefundClaimed(indexed address,uint256)
          handler: handleRefundClaimed
        - event: CampaignCancelled(indexed address)
          handler: handleCampaignCancelled
      file: ./src/mapping.ts
